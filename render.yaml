# Two services from one monorepo:
#   - backend  -> Render Web Service (FastAPI JSON API)
#   - frontend -> Render Static Site (plain HTML/CSS/JS)
# Postgres lives on Neon, object storage on Cloudflare R2 — both configured
# via env vars below (sync: false = set the value in the Render dashboard).

services:
  - type: web
    name: simuloschool-api
    runtime: python
    rootDir: backend
    plan: free
    # Ohio is Render's us-east-2 — same region as the Neon database. The
    # default (Oregon) puts a cross-country round trip on every query.
    region: ohio
    domains:
      - api.simuloschool.com
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Migrations run before boot (free tier has no preDeployCommand).
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL # Neon connection string (postgresql+psycopg://...)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "720"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      - key: CORS_ALLOWED_ORIGINS # must list every origin the browser loads the site from
        # The onrender.com host is kept so the site is testable before the
        # custom-domain DNS resolves and Render issues certificates.
        value: https://www.simuloschool.com,https://simuloschool.com,https://simuloschool-frontend.onrender.com
      # Generation runs in GitHub Actions, not here — these are set so an
      # operator can run the job manually against prod from a Render shell.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Object storage is NOT wired up yet — leave these blank in the
      # dashboard. /health then reports "storage": false and returns 200; only
      # video upload is broken. Fill them in (no redeploy of code needed) once
      # a provider is chosen; the client is plain S3, so any provider works.
      # Supabase: https://<project-ref>.supabase.co/storage/v1/s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      # Was "auto", which is R2-specific. Every other provider wants a real
      # region (Supabase/B2 reject "auto"), so this is per-environment now.
      - key: S3_REGION
        sync: false

  - type: web
    name: simuloschool-frontend
    runtime: static
    rootDir: frontend
    # Generate js/config.js from the API_BASE_URL env var at build time.
    buildCommand: 'echo "window.API_BASE_URL = \"$API_BASE_URL\";" > js/config.js'
    staticPublishPath: .
    domains:
      - www.simuloschool.com
      - simuloschool.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      # Set in the dashboard, not pinned here: the site has to be testable
      # against the API's onrender.com URL before api.simuloschool.com has DNS
      # and a certificate. Pinning it meant the first deploy shipped a
      # config.js pointing at a host that did not resolve — every request
      # failed with "Failed to fetch" before it left the browser.
      # Switch this to https://api.simuloschool.com once DNS is live.
      - key: API_BASE_URL
        sync: false
