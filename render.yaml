# Two services from one monorepo:
#   - backend  -> Render Web Service (FastAPI JSON API)
#   - frontend -> Render Static Site (plain HTML/CSS/JS)
# Postgres lives on Neon, object storage on Cloudflare R2 — both configured
# via env vars below (sync: false = set the value in the Render dashboard).

services:
  - type: web
    name: simuloschool-api
    runtime: python
    rootDir: backend
    plan: free
    domains:
      - api.simuloschool.com
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Migrations run before boot (free tier has no preDeployCommand).
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL # Neon connection string (postgresql+psycopg://...)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "720"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      - key: CORS_ALLOWED_ORIGINS # must list every origin the browser loads the site from
        value: https://www.simuloschool.com,https://simuloschool.com
      # Generation runs in GitHub Actions, not here — these are set so an
      # operator can run the job manually against prod from a Render shell.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL # R2: https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto

  - type: web
    name: simuloschool-frontend
    runtime: static
    rootDir: frontend
    # Generate js/config.js from the API_BASE_URL env var at build time.
    buildCommand: 'echo "window.API_BASE_URL = \"$API_BASE_URL\";" > js/config.js'
    staticPublishPath: .
    domains:
      - www.simuloschool.com
      - simuloschool.com
    routes:
      # Single-page-ish static site: unknown paths fall back to the landing page
      # rather than Render's 404.
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: API_BASE_URL
        value: https://api.simuloschool.com
