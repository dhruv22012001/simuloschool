[project]
name = "simuloschool-backend"
version = "0.1.0"
description = "SimuloSchool API — lesson videos with auto-generated tiered quizzes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "anthropic>=0.69",  # quiz generation
    "openai>=1.40",  # hosted Whisper transcription
    "python-multipart>=0.0.9",  # multipart video upload
    "pyjwt>=2.8",
    "passlib==1.7.4",
    "bcrypt==4.0.1",  # pinned: passlib 1.7.4 is incompatible with bcrypt>=4.1
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in argument defaults is the canonical FastAPI pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
