services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simulo
      POSTGRES_PASSWORD: simulo
      POSTGRES_DB: simuloschool
    ports:
      - "5432:5432"
      # Second mapping: a natively-installed Postgres often already owns
      # localhost:5432 and shadows this container for host-side tools.
      # Tests connect here so they always reach the container.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulo -d simuloschool"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/videos
      "

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://simulo:simulo@db:5432/simuloschool
      JWT_SECRET: local-dev-secret-not-for-prod
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      ADMIN_NAME: Admin
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
      # Passed through from your shell (or a root .env) — the job needs these,
      # the API runs fine without them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: videos
      S3_REGION: auto
    ports:
      - "8000:8000"
    # Apply migrations, then start the API.
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  miniodata:
