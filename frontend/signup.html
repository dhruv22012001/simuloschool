<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <title>Create your account — SimuloSchool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Baloo+2:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=12" />
  </head>
  <body class="auth-page">
    <main class="auth-inner">
      <a class="logo" href="index.html"><img class="logo-full" src="img/logo-full.png" alt="SimuloSchool" /></a>

      <div class="report-card auth-card">
        <span class="stamp-tab">Free trial</span>
        <span class="eyebrow">Because attendance isn't learning</span>
        <h1>Create your account</h1>
        <p class="subtitle">No credit card. Your first report lands after the first lesson.</p>

        <form id="signup-form">
          <label for="name">Student's name</label>
          <input id="name" type="text" autocomplete="name" required maxlength="255" />

          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />

          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            maxlength="72"
          />
          <p class="hint">At least 8 characters.</p>

          <label for="parent-email">
            Parent's email <span class="optional">optional — where reports are sent</span>
          </label>
          <input id="parent-email" type="email" autocomplete="email" />
          <p class="hint">You can add this later from your account.</p>

          <p id="signup-error" class="error" hidden></p>

          <button id="signup-submit" type="submit" class="btn btn-primary">
            Create account
          </button>
        </form>

        <p class="auth-alt">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>

      <p class="microcopy">Every lesson understood. Every parent informed.</p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js?v=11"></script>
    <script src="js/pages/signup.js?v=11"></script>
  </body>
</html>
